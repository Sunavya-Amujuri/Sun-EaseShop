<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Razorpay Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .test-credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
        }

        .test-credentials h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
        }

        .test-credentials p {
            margin: 5px 0;
            color: #666;
        }

        .test-credentials code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .token-info {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0c5460;
        }

        .token-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .link-btn {
            background: none;
            color: #667eea;
            text-decoration: underline;
            font-size: 14px;
            padding: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛒 Test Razorpay Payment</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">🔑 Login</div>
        <div class="tab" onclick="switchTab('payment')">💳 Payment</div>
    </div>

    <!-- Login Tab -->
    <div id="loginTab" class="tab-content active">
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="admin@gmail.com" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="admin123" placeholder="Enter password" required>
            </div>

            <button type="submit" id="loginBtn">🔓 Login</button>
            <div class="spinner" id="loginSpinner"></div>
        </form>

        <div id="loginMessage" class="message"></div>

        <div class="test-credentials">
            <h3>🧪 Test Login Credentials</h3>
            <p><strong>Email:</strong> <code>admin@gmail.com</code></p>
            <p><strong>Password:</strong> <code>admin123</code></p>
        </div>
    </div>

    <!-- Payment Tab -->
    <div id="paymentTab" class="tab-content">
        <div id="tokenInfo" class="token-info" style="display: none;">
            <strong>✅ Logged in successfully!</strong>
            <span id="userEmail"></span>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="orderId">Order ID</label>
                <input type="number" id="orderId" placeholder="Enter order ID (e.g., 1)" required>
            </div>

            <button type="submit" id="payBtn">💳 Pay Now</button>
            <button type="button" class="link-btn" onclick="switchTab('login')">🔄 Login Again</button>
            <div class="spinner" id="paySpinner"></div>
        </form>

        <div id="payMessage" class="message"></div>

        <div class="test-credentials">
            <h3>🧪 Razorpay Test Credentials</h3>
            <p><strong>Card Number:</strong> <code>4111 1111 1111 1111</code></p>
            <p><strong>CVV:</strong> <code>123</code></p>
            <p><strong>Expiry:</strong> Any future date</p>
            <p><strong>UPI:</strong> <code>success@razorpay</code></p>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let accessToken = localStorage.getItem('accessToken') || '';

    // Tab Switching
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('paymentTab').classList.add('active');
        }
    }

    // Show Message
    function showMessage(elementId, text, type) {
        const messageDiv = document.getElementById(elementId);
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';

        if (type === 'success' || type === 'error') {
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    }

    // Set Loading State
    function setLoading(btnId, spinnerId, loading) {
        const btn = document.getElementById(btnId);
        const spinner = document.getElementById(spinnerId);
        btn.disabled = loading;
        btn.style.display = loading ? 'none' : 'block';
        spinner.style.display = loading ? 'block' : 'none';
    }

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        setLoading('loginBtn', 'loginSpinner', true);
        showMessage('loginMessage', 'Logging in...', 'info');

        try {
            const response = await fetch(`${API_BASE}/api/v1/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Login failed');
            }

            const data = await response.json();
            accessToken = data.accessToken;

            // Save to localStorage
            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('userEmail', email);

            showMessage('loginMessage', '✅ Login successful!', 'success');

            // Update payment tab
            document.getElementById('tokenInfo').style.display = 'block';
            document.getElementById('userEmail').textContent = `Email: ${email}`;

            // Switch to payment tab after 1 second
            setTimeout(() => {
                switchTab('payment');
            }, 1000);

        } catch (error) {
            console.error('Login error:', error);
            showMessage('loginMessage', '❌ ' + error.message, 'error');
        } finally {
            setLoading('loginBtn', 'loginSpinner', false);
        }
    });

    // Payment Form
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const orderId = document.getElementById('orderId').value;

        if (!accessToken) {
            showMessage('payMessage', '❌ Please login first', 'error');
            setTimeout(() => switchTab('login'), 1500);
            return;
        }

        setLoading('payBtn', 'paySpinner', true);
        showMessage('payMessage', 'Creating payment order...', 'info');

        try {
            // Create payment order
            const createResponse = await fetch(`${API_BASE}/api/v1/ecommerce/payments/create/${orderId}`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json'
                }
            });

            if (!createResponse.ok) {
                const error = await createResponse.json();

                // Token expired - redirect to login
                if (error.error === 'SESSION_EXPIRED' || error.error === 'UNAUTHORIZED') {
                    localStorage.removeItem('accessToken');
                    accessToken = '';
                    showMessage('payMessage', '🔐 Session expired. Please login again.', 'error');
                    setTimeout(() => switchTab('login'), 2000);
                    return;
                }

                throw new Error(error.message || 'Failed to create payment order');
            }

            const paymentData = await createResponse.json();
            console.log('Payment order created:', paymentData);

            setLoading('payBtn', 'paySpinner', false);
            showMessage('payMessage', 'Opening Razorpay checkout...', 'info');

            // Open Razorpay
            const options = {
                key: paymentData.keyId,
                amount: parseFloat(paymentData.amount) * 100,
                currency: paymentData.currency,
                name: 'E-Commerce Store',
                description: `Payment for Order #${orderId}`,
                order_id: paymentData.razorpayOrderId,
                handler: async function(response) {
                    console.log('Payment response:', response);
                    showMessage('payMessage', 'Verifying payment...', 'info');

                    try {
                        const verifyResponse = await fetch(`${API_BASE}/api/v1/ecommerce/payments/verify`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + accessToken
                            },
                            body: JSON.stringify({
                                orderId: paymentData.orderId,
                                razorpayOrderId: response.razorpay_order_id,
                                razorpayPaymentId: response.razorpay_payment_id,
                                razorpaySignature: response.razorpay_signature
                            })
                        });

                        if (!verifyResponse.ok) {
                            const error = await verifyResponse.json();
                            throw new Error(error.message || 'Payment verification failed');
                        }

                        const result = await verifyResponse.json();
                        console.log('Verification result:', result);
                        showMessage('payMessage', '✅ Payment successful! Order confirmed.', 'success');
                        document.getElementById('orderId').value = '';

                    } catch (error) {
                        console.error('Verification error:', error);
                        showMessage('payMessage', '❌ Payment verification failed: ' + error.message, 'error');

                        await fetch(`${API_BASE}/api/v1/ecommerce/payments/failure/${orderId}?reason=${encodeURIComponent(error.message)}`, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + accessToken }
                        });
                    }
                },
                prefill: {
                    name: 'Test User',
                    email: localStorage.getItem('userEmail') || 'test@example.com',
                    contact: '9999999999'
                },
                theme: { color: '#667eea' },
                modal: {
                    ondismiss: async function() {
                        console.log('Payment cancelled');
                        showMessage('payMessage', '⚠️ Payment cancelled', 'error');

                        try {
                            await fetch(`${API_BASE}/api/v1/ecommerce/payments/cancel/${orderId}`, {
                                method: 'POST',
                                headers: { 'Authorization': 'Bearer ' + accessToken }
                            });
                        } catch (error) {
                            console.error('Cancel recording failed:', error);
                        }
                    }
                }
            };

            const rzp = new Razorpay(options);

            rzp.on('payment.failed', async function(response) {
                console.error('Payment failed:', response.error);
                showMessage('payMessage', '❌ Payment failed: ' + response.error.description, 'error');

                try {
                    await fetch(`${API_BASE}/api/v1/ecommerce/payments/failure/${orderId}?reason=${encodeURIComponent(response.error.description)}`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });
                } catch (error) {
                    console.error('Failure recording failed:', error);
                }
            });

            rzp.open();

        } catch (error) {
            console.error('Payment error:', error);
            setLoading('payBtn', 'paySpinner', false);
            showMessage('payMessage', '❌ ' + error.message, 'error');
        }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
        if (accessToken) {
            const email = localStorage.getItem('userEmail');
            document.getElementById('tokenInfo').style.display = 'block';
            document.getElementById('userEmail').textContent = `Email: ${email}`;
            switchTab('payment');
        }
    });
</script>
</body>
</html>
